<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Универсальные исполнители · Рабочий лист · 11 класс</title>
<style>
  :root{
    --bg-soft:#f5f5f7; --bg-elev:#ffffff;
    --text:#1d1d1f; --text-soft:#515154; --text-muted:#86868b;
    --border:#e5e5e7; --border-strong:#d2d2d7;
    --accent:#0071e3; --accent-soft:#e8f1fc; --accent-hover:#0077ed;
    --success:#1b8a4a; --success-soft:#e6f5ec;
    --error:#c5221f; --error-soft:#fde7e6;
    --warn:#b25e09; --warn-soft:#fcf1e2;
    --radius:14px; --radius-lg:18px;
    --shadow-sm:0 1px 2px rgba(0,0,0,.04),0 1px 3px rgba(0,0,0,.03);
    --shadow:0 2px 8px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05);
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,system-ui,sans-serif;
    --mono:"SF Mono",Menlo,Consolas,"Courier New",monospace;
    /* палитра «редактора кода» */
    --cw-bg:#161617; --cw-bg2:#1d1d1f; --cw-border:#2c2c2e; --cw-border2:#3a3a3c;
    --cw-text:#f5f5f7; --cw-muted:#98989d;
    --tk-com:#7f7f86; --tk-st:#c678dd; --tk-sym:#e5c07b; --tk-dir:#ff7ab2; --tk-num:#d19a66;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{font-family:var(--font);background:var(--bg-soft);color:var(--text);font-size:16px;line-height:1.55;-webkit-font-smoothing:antialiased;min-height:100vh}
  #app{max-width:780px;margin:0 auto;padding:24px 16px 80px}

  .topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
  .brand{display:flex;align-items:center;gap:10px;font-weight:600;font-size:15px;min-width:0}
  .brand-dot{width:10px;height:10px;border-radius:50%;background:var(--accent);flex-shrink:0}
  .brand-meta{font-size:12px;color:var(--text-muted);font-weight:400;margin-top:1px}
  .progress-pill{font-size:13px;color:var(--text-muted);padding:6px 12px;background:var(--bg-elev);border:1px solid var(--border);border-radius:999px;white-space:nowrap}

  .sheet-tabs{display:flex;gap:6px;margin-bottom:20px;background:var(--bg-elev);padding:6px;border-radius:14px;border:1px solid var(--border);overflow-x:auto}
  .sheet-tab{flex:1;min-height:44px;min-width:max-content;padding:0 12px;border-radius:10px;border:none;background:transparent;font-family:var(--font);font-size:13px;font-weight:500;color:var(--text-soft);cursor:pointer;transition:background .15s,color .15s;white-space:nowrap}
  .sheet-tab.active{background:var(--accent);color:#fff}
  .sheet-tab:not(.active):hover{background:var(--bg-soft)}
  .tab-score{display:inline-block;margin-left:5px;padding:1px 6px;background:var(--accent-soft);color:var(--accent);border-radius:6px;font-size:11px}
  .sheet-tab.active .tab-score{background:rgba(255,255,255,.22);color:#fff}

  .card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 24px;box-shadow:var(--shadow-sm);margin-bottom:16px}
  .card h1{font-size:28px;line-height:1.2;margin:0 0 8px;letter-spacing:-.02em;font-weight:700}
  .card h2{font-size:21px;line-height:1.25;margin:0 0 10px;letter-spacing:-.01em;font-weight:700}
  .card h3{font-size:17px;margin:18px 0 8px;font-weight:600}
  .card p{margin:0 0 10px}
  p.muted,.muted{color:var(--text-soft);font-size:14px}
  code{background:var(--bg-soft);padding:2px 6px;border-radius:6px;font-size:.93em;font-family:var(--mono)}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;font-size:15px;font-weight:500;font-family:var(--font);border:1px solid transparent;cursor:pointer;transition:background .15s,transform .05s;text-decoration:none}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:3px solid var(--accent-soft);outline-offset:2px}
  .btn:disabled{opacity:.45;cursor:not-allowed}
  .btn-primary{background:var(--accent);color:#fff}
  .btn-primary:hover:not(:disabled){background:var(--accent-hover)}
  .btn-secondary{background:var(--bg-elev);color:var(--text);border-color:var(--border-strong)}
  .btn-secondary:hover:not(:disabled){background:var(--bg-soft)}
  .btn-sm{min-height:44px;padding:0 12px;font-size:13px;border-radius:10px}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}

  .start-hero{text-align:center;padding:16px 8px 8px}
  .start-hero h1{font-size:30px;letter-spacing:-.02em}
  .start-meta{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin:16px 0 22px}
  .meta-chip{background:var(--bg-soft);border:1px solid var(--border);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--text-soft)}
  .plan-list{list-style:none;padding:0;margin:0 0 8px}
  .plan-list li{display:flex;gap:12px;padding:12px 0;border-bottom:1px solid var(--border);align-items:flex-start}
  .plan-list li:last-child{border-bottom:none}
  .plan-num{width:28px;height:28px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .plan-text{flex:1;font-size:15px;padding-top:3px}
  .plan-text small{display:block;color:var(--text-muted);font-size:13px;margin-top:2px}

  .theory-block{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 22px;margin-bottom:14px;box-shadow:var(--shadow-sm)}
  .theory-block h3{margin:0 0 12px;font-size:18px;font-weight:600}
  .theory-block ul,.theory-block ol{margin:0 0 12px;padding-left:22px}
  .theory-block li{margin-bottom:6px}
  .theory-block .task{background:var(--bg-soft);box-shadow:none}
  .note{background:var(--bg-soft);border-left:3px solid var(--accent);padding:12px 14px;border-radius:10px;margin:12px 0;font-size:15px}
  .note strong{color:var(--accent)}
  .progress-bar{height:6px;background:var(--border);border-radius:3px;overflow:hidden;margin-bottom:20px}
  .progress-fill{height:100%;background:var(--accent);transition:width .3s;border-radius:3px}

  /* ---------- «окно редактора кода» ---------- */
  .code-window{background:var(--cw-bg);border:1px solid var(--cw-border);border-radius:14px;overflow:hidden;box-shadow:var(--shadow);margin:12px 0}
  .code-titlebar{display:flex;align-items:center;gap:8px;padding:10px 14px;background:var(--cw-bg2);border-bottom:1px solid var(--cw-border)}
  .dot{width:12px;height:12px;border-radius:50%;flex-shrink:0}
  .dot.r{background:#ff5f57}.dot.y{background:#febc2e}.dot.g{background:#28c840}
  .code-filename{margin-left:6px;font-family:var(--mono);font-size:12px;color:var(--cw-muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .code-body{padding:14px}
  .code-body pre{margin:0;background:transparent;color:var(--cw-text);font-family:var(--mono);font-size:13px;line-height:1.75;overflow-x:auto;white-space:pre}
  .tk-com{color:var(--tk-com);font-style:italic}
  .tk-st{color:var(--tk-st)}
  .tk-sym{color:var(--tk-sym)}
  .tk-dir{color:var(--tk-dir);font-weight:600}
  .tk-num{color:var(--tk-num)}
  textarea.program{width:100%;min-height:130px;font-family:var(--mono);font-size:13px;line-height:1.7;padding:10px 12px;border:1px solid var(--cw-border2);border-radius:10px;background:var(--cw-bg2);color:var(--cw-text);resize:vertical;caret-color:#64d2ff}
  textarea.program:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.35)}
  .code-body .text-input{background:var(--cw-bg2);border:1px solid var(--cw-border2);color:var(--cw-text)}
  .code-body .text-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px rgba(0,113,227,.35)}
  .emu-label{display:block;font-size:12px;font-weight:600;color:var(--cw-muted);margin:12px 0 6px;text-transform:uppercase;letter-spacing:.05em}
  .emu-controls{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
  .emu-status{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 6px}
  .status-chip{font-size:12px;padding:4px 10px;border-radius:999px;background:var(--cw-bg2);border:1px solid var(--cw-border2);color:var(--cw-muted)}
  .status-chip strong{color:var(--cw-text)}
  .status-chip.ok{color:#32d74b;border-color:rgba(40,200,64,.45);background:rgba(40,200,64,.12)}
  .status-chip.err{color:#ff6961;border-color:rgba(255,69,58,.45);background:rgba(255,69,58,.12)}
  .tape-wrap{overflow-x:auto;padding:4px 0 8px}
  .tape{display:flex;gap:4px;min-width:min-content}
  .tape-col{display:flex;flex-direction:column;align-items:center;min-width:40px}
  .head-mark{height:16px;font-size:11px;color:#64d2ff;line-height:16px}
  .tape-cell{width:40px;height:46px;border:1px solid var(--cw-border2);border-radius:9px;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:18px;background:var(--cw-bg2);color:var(--cw-text)}
  .tape-cell.head{border-color:var(--accent);background:rgba(0,113,227,.28);box-shadow:0 0 0 2px rgba(0,113,227,.4)}
  .tape-cell.blank{color:#5a5a5e}
  .markov-word{font-family:var(--mono);font-size:22px;letter-spacing:2px;background:var(--cw-bg2);border:1px solid var(--cw-border2);border-radius:12px;padding:14px 12px;text-align:center;word-break:break-all;margin:12px 0;color:var(--cw-text)}
  .markov-word .muted{color:var(--cw-muted)}
  .logbox{background:var(--cw-bg2);border:1px solid var(--cw-border2);border-radius:10px;padding:10px 12px;font-size:12.5px;font-family:var(--mono);max-height:170px;overflow-y:auto;margin-top:10px;color:var(--cw-muted)}
  .logline{padding:2px 0;word-break:break-all}

  details.refcard summary{cursor:pointer;font-weight:600;font-size:15px;min-height:32px}
  details.refcard[open] summary{margin-bottom:10px}
  details.refcard ul{margin:8px 0 12px;padding-left:22px}
  details.refcard li{margin-bottom:5px;font-size:14px}

  .section-title{font-size:13px;text-transform:uppercase;letter-spacing:.08em;color:var(--text-muted);font-weight:600;margin:26px 0 12px}

  .task{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;margin-bottom:14px;box-shadow:var(--shadow-sm);transition:border-color .2s,background .2s}
  .task.correct{border-color:var(--success);background:var(--success-soft)}
  .task.incorrect{border-color:var(--error);background:var(--error-soft)}
  .task-top{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
  .task-num{font-size:13px;color:var(--text-muted);font-weight:600}
  .task-meta{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
  .task-points{font-size:12px;color:var(--text-muted);background:var(--bg-soft);padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge-solved{font-size:12px;color:var(--success);background:var(--success-soft);border:1px solid #bfe3cd;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .badge-hint{font-size:12px;color:var(--warn);background:var(--warn-soft);border:1px solid #ecd0ab;padding:4px 10px;border-radius:999px;white-space:nowrap}
  .task-question{font-size:15.5px;margin-bottom:12px;line-height:1.5}
  .tests-list{font-size:13px;color:var(--text-soft);background:var(--bg-soft);border:1px solid var(--border);border-radius:10px;padding:8px 12px;margin:10px 0}
  .answer-row{display:flex;gap:8px;margin-top:12px;flex-wrap:wrap}
  .answer-row .text-input{flex:1;min-width:180px}
  .text-input{width:100%;min-height:44px;padding:10px 14px;border:1px solid var(--border);border-radius:12px;font-family:var(--font);font-size:15px;background:var(--bg-elev);color:var(--text)}
  .text-input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .hint-btn{background:transparent;border:1px solid var(--border-strong);color:var(--text-soft);min-height:44px;padding:0 12px;border-radius:10px;font-size:13px;font-family:var(--font);cursor:pointer}
  .hint-btn:hover{background:var(--bg-soft)}
  .giveup-btn{margin-left:auto;background:transparent;border:1px dashed var(--border-strong);color:var(--text-muted);min-height:44px;padding:0 14px;border-radius:10px;font-size:13px;font-family:var(--font);cursor:pointer}
  .giveup-btn:hover{color:var(--error);border-color:var(--error);background:var(--error-soft)}
  .hint-box{background:var(--accent-soft);border-left:3px solid var(--accent);padding:10px 14px;border-radius:10px;margin:10px 0;font-size:14px;color:#0a5cb8}
  .options{display:flex;flex-direction:column;gap:8px}
  .option{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--border);border-radius:12px;cursor:pointer;transition:background .15s,border-color .15s;background:var(--bg-elev);min-height:44px}
  .option:hover{background:var(--bg-soft)}
  .option input{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
  .option span{flex:1;font-size:15px}
  .option.selected{border-color:var(--accent);background:var(--accent-soft)}
  .feedback{margin-top:12px;padding:10px 14px;border-radius:10px;font-size:14px}
  .feedback.ok{background:var(--success-soft);color:var(--success)}
  .feedback.err{background:var(--error-soft);color:var(--error)}
  .feedback.warn{background:var(--warn-soft);color:var(--warn)}

  .results-card{background:var(--bg-elev);border:1px solid var(--border);border-radius:var(--radius-lg);padding:30px 24px;text-align:center;box-shadow:var(--shadow)}
  .score-circle{width:140px;height:140px;border-radius:50%;background:linear-gradient(135deg,var(--accent),#00a3ff);color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;margin:0 auto 18px;box-shadow:0 8px 24px rgba(0,113,227,.25)}
  .score-value{font-size:40px;font-weight:700;line-height:1;letter-spacing:-.02em}
  .score-label{font-size:13px;opacity:.9;margin-top:4px}
  .grade-text{font-size:20px;font-weight:600;margin-bottom:6px}
  .grade-desc{color:var(--text-soft);font-size:15px;margin-bottom:18px}
  .summary-row{display:flex;justify-content:space-between;align-items:center;padding:10px 14px;background:var(--bg-soft);border-radius:10px;margin-bottom:8px;font-size:14px;text-align:left;gap:8px}
  .summary-row strong{color:var(--accent);white-space:nowrap}
  details.report{text-align:left;background:var(--bg-elev);border:1px solid var(--border);border-radius:12px;padding:12px 16px;margin-bottom:10px}
  details.report summary{cursor:pointer;font-weight:600;font-size:14px;min-height:32px}
  .report-line{display:flex;gap:8px;align-items:baseline;font-size:13.5px;padding:6px 0;border-bottom:1px solid var(--border);flex-wrap:wrap}
  .report-line:last-child{border-bottom:none}
  .r-ok{color:var(--success);font-weight:600}
  .r-err{color:var(--error);font-weight:600}
  .r-none{color:var(--text-muted)}
  .r-note{color:var(--text-muted);font-size:12px}

  .print-only{display:none}
  .print-table{width:100%;border-collapse:collapse;font-size:11.5px;margin:10px 0}
  .print-table th,.print-table td{border:1px solid #9a9a9e;padding:4px 6px;text-align:left;vertical-align:top}
  .print-table th{background:#efeff1}

  .fade-in{animation:fadeIn .3s ease}
  @keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

  @media (max-width:480px){
    #app{padding:16px 10px 60px}
    .card{padding:20px 16px}
    .card h1{font-size:23px}
    .card h2{font-size:18px}
    .start-hero h1{font-size:25px}
    .task{padding:16px}
    .code-body{padding:12px}
    .score-circle{width:120px;height:120px}
    .score-value{font-size:34px}
    .tape-cell{width:36px;height:42px;font-size:16px}
    .tape-col{min-width:36px}
  }

  @media print{
    body{background:#fff}
    #app{max-width:100%;padding:0}
    .sheet-tabs,.topbar,.btn-row,.btn,.hint-btn,.giveup-btn,.emu-controls,
    .code-window,.task,.theory-block,details.report,.summary-row,.score-circle,
    .grade-text,.grade-desc,.no-print{display:none !important}
    .results-card{border:none;box-shadow:none;padding:0;border-radius:0}
    .print-only{display:block !important}
  }
</style>
</head>
<body>
<div id="app" role="main"></div>
<script>
"use strict";
/* =========================================================
   CONSTANTS
   ========================================================= */
const TEACHER_NAME = "Масликов Михаил Михайлович";
const STORE_KEY = "universal_executors_ws_v2";
const TOTAL_MAX = 50;                 // теория 10 + тест 10 + 3 листа по 10
const MAX_ATTEMPTS_REVEAL = 3;
const TM_STEP_LIMIT = 500, POST_STEP_LIMIT = 500, MARKOV_STEP_LIMIT = 200;

/* ---------- ТЕОРИЯ: 10 слайдов + блиц-проверка ---------- */
const THEORY = [
  { emoji:"🧭", title:"Универсальные исполнители",
    content:`
      <p><strong>Универсальный исполнитель</strong> — учебная модель абстрактной вычислительной машины, на которой можно записать <em>любой</em> алгоритм.</p>
      <ul>
        <li>🎞 <strong>машина Тьюринга</strong> — А. Тьюринг, 1936 г.;</li>
        <li>📼 <strong>машина Поста</strong> — Э. Л. Пост;</li>
        <li>🔤 <strong>нормальные алгорифмы Маркова</strong> — А. А. Марков, 1940-е гг.</li>
      </ul>
      <div class="note"><strong>Зачем?</strong> Эти модели уточняют само понятие «алгоритм» и лежат в основе теории вычислимости: всё, что вообще можно вычислить, вычислимо на любой из них.</div>`,
    quiz:{id:"th1",kind:"choice",points:1,title:"Блиц-проверка",
      question:"Что утверждает тезис Тьюринга?",
      options:["Любой алгоритм может быть записан в виде программы для машины Тьюринга",
               "Любая программа машины Тьюринга обязательно останавливается",
               "Машина Тьюринга работает быстрее любых других исполнителей",
               "Алгоритмы можно записывать только на языках программирования"],
      correct:0, hint:"Речь о связи понятий «алгоритм» и «программа для машины Тьюринга»."} },
  { emoji:"🎞", title:"Машина Тьюринга: устройство",
    content:`
      <ul>
        <li><strong>Лента</strong> — бесконечная, разбита на ячейки; в каждой ячейке один символ алфавита A = {a<sub>0</sub>, a<sub>1</sub>, …, a<sub>N</sub>}.</li>
        <li>Символ «пробел» (пустая ячейка) обозначается a<sub>0</sub>, Λ или <code>_</code>.</li>
        <li><strong>Каретка</strong> (считывающая и записывающая головка) читает и записывает символы, двигается вдоль ленты.</li>
        <li>Работой управляет <strong>таблица</strong>: строки — символы алфавита, столбцы — состояния Q = {q<sub>0</sub>, q<sub>1</sub>, …, q<sub>M</sub>}.</li>
      </ul>
      <div class="note">Старт — в состоянии <strong>q1</strong>. Состояние <strong>q0 — конечное</strong>: попав в него, автомат заканчивает работу.</div>`,
    quiz:{id:"th2",kind:"choice",points:1,title:"Блиц-проверка",
      question:"Какова лента машины Тьюринга?",
      options:["Бесконечная, разбитая на ячейки, в каждой — символ алфавита",
               "Конечная, ровно 256 ячеек",
               "Бесконечная, но хранить можно только цифры",
               "Это набор регистров процессора"],
      correct:0, hint:"Ключевое слово — «бесконечная»: лента может расти в обе стороны."} },
  { emoji:"⚙️", title:"Машина Тьюринга: команда и пример",
    content:`
      <p><strong>Команда</strong> в клетке таблицы состоит из трёх частей: 1) символ для записи; 2) направление: <code>&gt;</code> (вправо), <code>&lt;</code> (влево), <code>.</code> (на месте); 3) новое состояние.</p>
      <p>Пример программы «заменить все a на b»:</p>

/* =========================================================
   ДВИЖКИ МАШИН
   ========================================================= */
function tapeWord(cells){
  const ks = Object.keys(cells).map(Number).filter(i=>cells[i] && cells[i]!=="_");
  if(!ks.length) return "";
  const lo = Math.min(...ks), hi = Math.max(...ks);
  let s = "";
  for(let i=lo;i<=hi;i++) s += (cells[i] || "_");
  return s;
}
function cellsFromWord(word){
  const cells = {};
  const w = String(word||"").trim().replace(/\s+/g,"");
  for(let i=0;i<w.length;i++){ if(w[i] !== "_") cells[i] = w[i]; }
  return cells;
}
/* --- Тьюринг --- */
function tmParse(text){
  const cmds = {}, errors = [];
  String(text||"").split("\n").forEach((raw,i)=>{
    const t = raw.trim();
    if(!t || t.startsWith("#") || t.startsWith("//")) return;
    const p = t.split(/\s+/);
    if(p.length !== 5){ errors.push("строка "+(i+1)+": нужно 5 частей (состояние символ новыйСимвол направление новоеСостояние)"); return; }
    const st=p[0], sym=p[1], w=p[2], dir=p[3], next=p[4];
    if(dir!==">" && dir!=="<" && dir!=="."){ errors.push("строка "+(i+1)+": направление должно быть «>», «<» или «.»"); return; }
    if(st==="q0"){ errors.push("строка "+(i+1)+": q0 — конечное состояние, команды в нём не задаются"); return; }
    cmds[st+"|"+sym] = {w:w,dir:dir,next:next};
  });
  return {cmds:cmds, errors:errors};
}
function tmInit(word){ return {cells:cellsFromWord(word), head:0, st:"q1", status:"ready", steps:0, msg:""}; }
function tmStepOnce(rt, cmds){
  if(rt.status!=="ready") return;
  const sym = rt.cells[rt.head] || "_";
  const c = cmds[rt.st+"|"+sym];
  if(!c){ rt.status="error"; rt.msg="Ошибка: нет команды для ("+rt.st+", "+sym+")"; return; }
  if(c.w==="_") delete rt.cells[rt.head]; else rt.cells[rt.head]=c.w;
  if(c.dir===">") rt.head++; else if(c.dir==="<") rt.head--;
  rt.steps++;
  rt.st = c.next;
  if(rt.st==="q0"){ rt.status="halted"; rt.msg="Останов: конечное состояние q0"; }
}
function tmRun(rt, cmds, limit){
  while(rt.status==="ready" && rt.steps<limit) tmStepOnce(rt, cmds);
  if(rt.status==="ready"){ rt.status="loop"; rt.msg="Не остановилась за "+limit+" шагов — вероятно, зацикливание"; }
}
function tmRunTests(text, tests){
  const prog = tmParse(text);
  if(prog.errors.length) return {ok:false, msg:"Ошибка в программе: "+prog.errors[0]};
  if(!Object.keys(prog.cmds).length) return {ok:false, msg:"Программа пуста — напишите хотя бы одну команду."};
  for(const t of tests){
    const rt = tmInit(t.in);
    tmRun(rt, prog.cmds, TM_STEP_LIMIT);
    if(rt.status==="error") return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: "+rt.msg};
    if(rt.status==="loop") return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: "+rt.msg};
    const w = tapeWord(rt.cells);
    if(w !== t.out) return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: ожидалось «"+(t.out||"(пусто)")+"», получено «"+(w||"(пусто)")+"»"};
    if(t.head==="after"){
      const ks = Object.keys(rt.cells).map(Number);
      const want = ks.length ? Math.max(...ks)+1 : 0;
      if(rt.head !== want) return {ok:false, msg:"Тест «"+t.in+"»: слово верное, но каретка должна стоять на первой пустой ячейке справа от слова"};
    }
  }
  return {ok:true};
}
/* --- Пост --- */
function targetParse(tok){
  if(tok==null) return {target:null, thenStop:false};
  if(tok===".") return {target:null, thenStop:true};
  if(/^\d+$/.test(tok)) return {target:tok, thenStop:false};
  return {target:"?", thenStop:false};
}
function postParse(text){
  const errors = [], items = [];
  let anyLabel = false;
  String(text||"").split("\n").forEach(raw=>{
    let t = raw.trim();
    if(!t || t.startsWith("#") || t.startsWith("//")) return;
    let label = null;
    const m = t.match(/^(\d+)\s*:\s*(.*)$/);
    if(m){ label = m[1]; t = m[2].trim(); anyLabel = true; }
    items.push({label:label, body:t, seq:items.length+1});
  });
  items.forEach(it=>{ it.key = anyLabel ? it.label : String(it.seq); });
  if(anyLabel && items.some(it=>!it.label)) errors.push("если используются номера строк «N:», они должны быть у каждой команды");
  const indexOfKey = {};
  items.forEach((it,i)=>{
    if(it.key==null) return;
    if(indexOfKey[it.key]!==undefined) errors.push("номер строки "+it.key+" встречается дважды");
    else indexOfKey[it.key] = i;
  });
  items.forEach(it=>{
    const p = it.body.replace(/,/g," ").split(/\s+/).filter(Boolean);
    if(!p.length){ errors.push("строка "+it.seq+": пустая команда"); return; }
    const op = p[0];
    if(op===".") it.cmd = {type:"stop"};
    else if(op===">"||op==="<") it.cmd = Object.assign({type:"move",dir:op}, targetParse(p[1]));
    else if(op==="0"||op==="1"||op==="_") it.cmd = Object.assign({type:"write",sym:op}, targetParse(p[1]));
    else if(op==="?"){
      if(p.length===3) it.cmd = {type:"branch",targets:[p[1],p[2]]};
      else if(p.length===4) it.cmd = {type:"branch",targets:[p[1],p[2],p[3]]};
      else errors.push("строка "+it.seq+": команда «?» требует 2 или 3 номера строк");
    }
    else errors.push("строка "+it.seq+": неизвестная команда «"+op+"»");
  });
  items.forEach(it=>{
    if(!it.cmd) return;
    const tgs = it.cmd.targets || (it.cmd.target!=null ? [it.cmd.target] : []);
    tgs.forEach(tg=>{ if(indexOfKey[tg]===undefined) errors.push("строка "+it.seq+": нет строки с номером «"+tg+"»"); });
  });
  return {items:items, indexOfKey:indexOfKey, errors:errors};
}
function postInit(word){ return {cells:cellsFromWord(word), head:0, cur:0, status:"ready", steps:0, msg:""}; }
function postStepOnce(rt, prog){
  if(rt.status!=="ready") return;
  if(rt.cur>=prog.items.length){ rt.status="halted"; rt.msg="Конец программы"; return; }
  const it = prog.items[rt.cur], c = it.cmd;
  if(!c){ rt.status="error"; rt.msg="Строка "+it.seq+": команда не распознана"; return; }
  rt.steps++;
  const goNext = ()=>{
    if(c.thenStop){ rt.status="halted"; rt.msg="Останов (команда «.»)"; return; }
    if(c.target!=null) rt.cur = prog.indexOfKey[c.target];
    else rt.cur++;
    if(rt.status==="ready" && rt.cur>=prog.items.length){ rt.status="halted"; rt.msg="Конец программы"; }
  };
  switch(c.type){
    case "stop": rt.status="halted"; rt.msg="Останов (команда «.»)"; break;
    case "move": rt.head += (c.dir===">"?1:-1); goNext(); break;
    case "write":
      if(c.sym==="_") delete rt.cells[rt.head]; else rt.cells[rt.head]=c.sym;
      goNext(); break;
    case "branch":{
      const sym = rt.cells[rt.head] || "_";
      let ti;
      if(c.targets.length===3) ti = (sym==="_")?0:(sym==="0"?1:2);
      else ti = (sym==="_")?0:1;
      const idx = prog.indexOfKey[c.targets[ti]];
      if(idx===undefined){ rt.status="error"; rt.msg="Строка "+it.seq+": неверный номер строки в команде «?»"; break; }
      rt.cur = idx; break;
    }
  }
}
function postRun(rt, prog, limit){
  while(rt.status==="ready" && rt.steps<limit) postStepOnce(rt, prog);
  if(rt.status==="ready"){ rt.status="loop"; rt.msg="Не остановилась за "+limit+" шагов — вероятно, зацикливание"; }
}
function postRunTests(text, tests){
  const prog = postParse(text);
  if(prog.errors.length) return {ok:false, msg:"Ошибка в программе: "+prog.errors[0]};
  if(!prog.items.length) return {ok:false, msg:"Программа пуста."};
  for(const t of tests){
    const rt = postInit(t.in);
    postRun(rt, prog, POST_STEP_LIMIT);
    if(rt.status==="error") return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: "+rt.msg};
    if(rt.status==="loop") return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: "+rt.msg};
    const w = tapeWord(rt.cells);
    if(w !== t.out) return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: ожидалось «"+(t.out||"(пусто)")+"», получено «"+(w||"(пусто)")+"»"};
    if(t.head==="after"){
      const ks = Object.keys(rt.cells).map(Number);
      const want = ks.length ? Math.max(...ks)+1 : 0;
      if(rt.head !== want) return {ok:false, msg:"Тест «"+t.in+"»: слово верное, но каретка должна стоять на первой пустой ячейке справа от слова"};
    }
  }
  return {ok:true};
}
/* --- Марков --- */
function unquote(s){
  if(s.length>=2 && ((s[0]==="'" && s[s.length-1]==="'") || (s[0]==='"' && s[s.length-1]==='"'))) return s.slice(1,-1);
  return s;
}
function markovParse(text){
  const rules = [], errors = [];
  String(text||"").split("\n").forEach((raw,i)=>{
    const t = raw.trim();
    if(!t || t.startsWith("#") || t.startsWith("//")) return;
    const pos = t.indexOf("->");
    if(pos<0){ errors.push("строка "+(i+1)+": нет знака «->»"); return; }
    const l = unquote(t.slice(0,pos).trim());
    let r = t.slice(pos+2).trim();
    let terminal = false;
    if(r.endsWith(".")){ terminal = true; r = r.slice(0,-1).trim(); }
    rules.push({l:l, r:unquote(r), terminal:terminal});
  });
  return {rules:rules, errors:errors};
}
function markovInit(word){ return {word:String(word||"").trim(), status:"ready", steps:0, log:[], msg:""}; }
function markovStepOnce(rt, rules){
  if(rt.status!=="ready") return;
  for(let i=0;i<rules.length;i++){
    const r = rules[i];
    const ruleText = (r.l||"∅")+" → "+(r.r||"∅")+(r.terminal?" .":"");
    if(r.l===""){
      const before = rt.word;
      rt.word = r.r + rt.word; rt.steps++;
      rt.log.push({n:rt.steps, rule:ruleText, before:before, after:rt.word});
      if(rt.log.length>60) rt.log.shift();
      if(r.terminal){ rt.status="halted"; rt.msg="Останов: терминальная подстановка №"+(i+1); }
      return;
    }
    const idx = rt.word.indexOf(r.l);
    if(idx>=0){
      const before = rt.word;
      rt.word = rt.word.slice(0,idx) + r.r + rt.word.slice(idx + r.l.length);
      rt.steps++;
      rt.log.push({n:rt.steps, rule:ruleText, before:before, after:rt.word});
      if(rt.log.length>60) rt.log.shift();
      if(r.terminal){ rt.status="halted"; rt.msg="Останов: терминальная подстановка №"+(i+1); }
      return;
    }
  }
  rt.status="halted"; rt.msg="Завершён: нет применимых подстановок";
}
function markovRun(rt, rules, limit){
  while(rt.status==="ready" && rt.steps<limit) markovStepOnce(rt, rules);
  if(rt.status==="ready"){ rt.status="loop"; rt.msg="Не завершился за "+limit+" шагов — вероятно, зацикливание"; }
}
function markovRunTests(text, tests){
  const p = markovParse(text);
  if(p.errors.length) return {ok:false, msg:"Ошибка в алгорифме: "+p.errors[0]};
  if(!p.rules.length) return {ok:false, msg:"Алгорифм пуст."};
  for(const t of tests){
    const rt = markovInit(t.in);
    markovRun(rt, p.rules, MARKOV_STEP_LIMIT);
    if(rt.status==="loop") return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: "+rt.msg};
    if(rt.word !== t.out) return {ok:false, msg:"Тест «"+(t.in||"(пусто)")+"»: ожидалось «"+(t.out||"(пусто)")+"», получено «"+(rt.word||"(пусто)")+"»"};
  }
  return {ok:true};
}

function esc(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- подсветка «как в редакторе» ---------- */
function hlLine(line, machine){
  if(/^\s*(#|\/\/)/.test(line)) return '<span class="tk-com">'+esc(line)+'</span>';
  if(!line.trim()) return "";
  if(machine==="turing"){
    const p = line.split(/\s+/).filter(Boolean);
    if(p.length===5){
      return '<span class="tk-st">'+esc(p[0])+'</span> <span class="tk-sym">'+esc(p[1])+'</span> <span class="tk-sym">'+esc(p[2])+'</span> <span class="tk-dir">'+esc(p[3])+'</span> <span class="tk-st">'+esc(p[4])+'</span>';
    }
    return esc(line);
  }
  if(machine==="post"){
    const m = line.match(/^(\d+\s*:)?\s*(.*)$/);
    let out = m[1] ? '<span class="tk-num">'+esc(m[1])+'</span> ' : "";
    const p = (m[2]||"").split(/\s+/).filter(Boolean);
    if(p.length){
      out += '<span class="tk-dir">'+esc(p[0])+'</span>';
      p.slice(1).forEach(tok=>{ out += ' <span class="'+(tok==="."?"tk-dir":"tk-num")+'">'+esc(tok)+'</span>'; });
    }
    return out;
  }
  const idx = line.indexOf("->");
  if(idx<0) return esc(line);
  const l = line.slice(0,idx), r = line.slice(idx+2);
  const term = /\.\s*$/.test(r);
  const rClean = r.replace(/\s*\.\s*$/,"");
  return '<span class="tk-sym">'+esc(l)+'</span><span class="tk-dir"> -&gt; </span><span class="tk-sym">'+esc(rClean)+'</span>'+(term?'<span class="tk-dir"> .</span>':"");
}
function hlProgram(text, machine){ return String(text||"").split("\n").map(l=>hlLine(l,machine)).join("\n"); }

}

    + (ts.solved ? '<span class="badge-solved">✓ решено · '+fmtPts(taskPoints(t))+' б.</span>' : "")

  if(t.kind==="choice"){

    const isMarkov = t.machine==="markov";

    h += '<p class="muted">'+(isMarkov?"🔡 Начальное слово":"🎞 Начальная лента")+': <code>'+esc(t.word)||"(пусто)";
    h += '</code>'+(isMarkov?"":" · каретка на первом символе")+(t.machine==="turing"?" · состояние q1":"")+'</p>';
    h += '<button class="btn btn-secondary btn-sm" data-action="emu-load" data-task="'+t.id+'" style="margin-bottom:4px;">▶ Загрузить в эмулятор</button>';
    h += '<div class="answer-row"><input type="text" class="text-input" value="'+esc(ts.answer)+'" placeholder="'+(isMarkov?"Итоговое слово":"Итоговая лента, например: 1010")+'" '+disabled+' data-model="ts.answer" data-id="'+t.id+'"><button class="btn btn-primary btn-sm" data-action="check" data-task="'+t.id+'" '+disabled+'>Проверить ✔</button></div>';
  }

    h += codeWindow("solution_"+t.id+"."+t.machine+" · ваша программа",
        '<textarea class="program" rows="8" spellcheck="false" '+disabled+' data-model="ts.program" data-id="'+t.id+'">'+esc(ts.program||t.template||"")+'</textarea>'
        + '<div class="btn-row" style="margin-top:10px;"><button class="btn btn-primary btn-sm" data-action="check" data-task="'+t.id+'" '+disabled+'>Проверить ✔</button><button class="btn btn-secondary btn-sm" data-action="emu-debug" data-task="'+t.id+'">🐞 Отладить в эмуляторе</button>'
        + ((ts.solved||ts.locked) ? "" : '<button class="giveup-btn" data-action="giveup" data-task="'+t.id+'" title="Показать эталонное решение, за задание 0 баллов">Я сдаюсь</button>')

/* ---------- визуализация эмулятора ---------- */
function ensureRuntime(sheet){
  const em = state.emu[sheet];
  if(!em.runtime) em.runtime = (sheet==="markov") ? markovInit(em.word) : (sheet==="turing" ? tmInit(em.word) : postInit(em.word));
  return em.runtime;
}
function tapeHtml(cells, head){
  const ks = Object.keys(cells).map(Number).concat([head]);
  let lo = Math.min(...ks)-3, hi = Math.max(...ks)+3;
  if(hi-lo+1 < 11){ const mid = Math.floor((lo+hi)/2); lo = mid-5; hi = mid+5; }
  let h = '<div class="tape-wrap"><div class="tape">';
  for(let i=lo;i<=hi;i++){
    const sym = cells[i] || "_";
    const isH = i===head;
    h += '<div class="tape-col"><div class="head-mark" aria-hidden="true">'+(isH?"▼":"")+'</div><div class="tape-cell'+(isH?" head":"")+(sym==="_"?" blank":"")+'">'+esc(sym)+'</div></div>';
  }
  return h + "</div></div>";
}
function statusChipsHtml(rt, extra){
  let cls = "status-chip";
  if(rt.status==="halted") cls += " ok";
  if(rt.status==="error"||rt.status==="loop") cls += " err";
  const msg = rt.msg || (rt.status==="ready" ? (rt.steps? "Готово к следующему шагу 👣" : "Готово к работе — нажмите «Шаг» или «Пуск» ▶") : rt.status);
  return '<div class="emu-status">'+extra+'<span class="'+cls+'">'+esc(msg)+'</span></div>';
}
function emuVizHtml(sheet){
  const em = state.emu[sheet];
  const rt = ensureRuntime(sheet);
  if(sheet==="turing"){
    const p = tmParse(em.program);
    if(p.errors.length) return statusChipsHtml({status:"error",msg:"Ошибка в программе: "+p.errors[0],steps:0},"");
    return statusChipsHtml(rt, '<span class="status-chip">Состояние: <strong>'+esc(rt.st)+'</strong></span><span class="status-chip">Шаг: '+rt.steps+'</span>') + tapeHtml(rt.cells, rt.head);
  }
  if(sheet==="post"){
    const p = postParse(em.program);
    if(p.errors.length) return statusChipsHtml({status:"error",msg:"Ошибка в программе: "+p.errors[0],steps:0},"");
    const curLine = (rt.status==="ready" && rt.cur<p.items.length) ? ("строка "+p.items[rt.cur].seq) : "—";
    return statusChipsHtml(rt, '<span class="status-chip">Текущая строка: <strong>'+esc(curLine)+'</strong></span><span class="status-chip">Шаг: '+rt.steps+'</span>') + tapeHtml(rt.cells, rt.head);
  }
  const p = markovParse(em.program);
  if(p.errors.length) return statusChipsHtml({status:"error",msg:"Ошибка в алгорифме: "+p.errors[0],steps:0},"");
  let h = statusChipsHtml(rt, '<span class="status-chip">Шаг: '+rt.steps+'</span>');
  h += '<div class="markov-word">'+(rt.word ? esc(rt.word) : '<span class="muted">(пусто)</span>')+'</div>';
  if(rt.log.length){
    h += '<div class="logbox">' + rt.log.slice(-8).map(e=>'<div class="logline">шаг '+e.n+' · «'+esc(e.rule)+'»: «'+(esc(e.before)||"∅")+'» → «'+(esc(e.after)||"∅")+'»</div>').join("") + '</div>';
  }
  return h;
}
function updateEmuViz(sheet){
  const viz = document.getElementById("emu-viz");
  if(viz) viz.innerHTML = emuVizHtml(sheet);
}

/* =========================================================
   HANDLERS
   ========================================================= */
function onAction(e){
  const btn = e.currentTarget, action = btn.dataset.action;
  if(action==="go"){ state.sheet = btn.dataset.sheet; render(); return; }
  if(action==="theory-next"){ state.theoryStep = Math.min(state.theoryStep+1, THEORY.length-1); render(); window.scrollTo({top:0, behavior:"smooth"}); return; }
  if(action==="theory-prev"){ state.theoryStep = Math.max(state.theoryStep-1, 0); render(); return; }
  if(action==="hint"){
    const ts = getTS(btn.dataset.task);
    ts.hintOpen = !ts.hintOpen;
    if(ts.hintOpen) ts.hintUsed = true;
    render(); return;
  }
  if(action==="check"){ doCheck(btn.dataset.task); return; }
  if(action==="giveup"){
    const ts = getTS(btn.dataset.task);
    if(ts.solved || ts.locked) return;
    if(!confirm("Показать эталонное решение? Задание будет оценено в 0 баллов.")) return;
    ts.gaveUp = true; ts.locked = true; ts.hintOpen = false;
    ts.feedback = {type:"err", text:"🏳 Показано эталонное решение. Задание: 0 баллов."};
    render(); return;
  }
  if(action==="emu-load"){
    const t = findTask(btn.dataset.task); if(!t) return;
    const em = state.emu[t.machine];
    em.program = t.program; em.word = t.word; em.runtime = null;
    scrollTarget = "emucard"; render(); return;
  }
  if(action==="emu-debug"){
    const t = findTask(btn.dataset.task); if(!t) return;
    const ts = getTS(t.id);
    const em = state.emu[t.machine];
    em.program = ts.program || t.template || "";
    em.word = (t.tests && t.tests[0] ? t.tests[0].in : "") || "";
    em.runtime = null;
    scrollTarget = "emucard"; render(); return;
  }
  if(action==="emu-reset"||action==="emu-step"||action==="emu-run"){
    const sheet = btn.dataset.id, em = state.emu[sheet];
    if(action==="emu-reset") em.runtime = null;
    const rt = ensureRuntime(sheet);
    if(action!=="emu-reset" && rt.status==="ready"){
      if(sheet==="turing"){
        const p = tmParse(em.program);
        if(p.errors.length){ rt.status="error"; rt.msg="Ошибка в программе: "+p.errors[0]; }
        else if(action==="emu-step") tmStepOnce(rt, p.cmds); else tmRun(rt, p.cmds, TM_STEP_LIMIT);
      } else if(sheet==="post"){
        const p = postParse(em.program);
        if(p.errors.length){ rt.status="error"; rt.msg="Ошибка в программе: "+p.errors[0]; }
        else if(action==="emu-step") postStepOnce(rt, p); else postRun(rt, p, POST_STEP_LIMIT);
      } else {
        const p = markovParse(em.program);
        if(p.errors.length){ rt.status="error"; rt.msg="Ошибка в алгорифме: "+p.errors[0]; }
        else if(action==="emu-step") markovStepOnce(rt, p.rules); else markovRun(rt, p.rules, MARKOV_STEP_LIMIT);
      }
    }
    updateEmuViz(sheet); saveState(); return;
  }
  if(action==="print"){ window.print(); return; }
  if(action==="reset-all"){
    if(confirm("Сбросить весь прогресс (ответы, программы, баллы, подсказки)? Это действие нельзя отменить.")){
      try{ localStorage.removeItem(STORE_KEY); }catch(err){}
      state.sheet="start"; state.theoryStep=0; state.tasks={}; state.studentName="";
      state.emu.turing = {program:"q1 a b > q1\nq1 b b > q1\nq1 _ _ . q0", word:"abba", runtime:null};
      state.emu.post = {program:"1: ? 3 2\n2: > 1\n3: 1 .", word:"101", runtime:null};
      state.emu.markov = {program:"a -> b", word:"abab", runtime:null};
      render();
    }
    return;
  }
}
function doCheck(id){
  const task = findTask(id); if(!task) return;
  const ts = getTS(id);
  if(ts.solved || ts.locked) return;
  if(task.kind==="choice"){
    if(ts.selected==null){ ts.feedback={type:"warn",text:"Выберите вариант ответа."}; render(); return; }
    ts.attempts++;
    if(ts.selected===task.correct){
      ts.solved = true;
      ts.feedback = {type:"ok", text: ts.hintUsed ? "Верно! +0,5 балла (использована подсказка)." : "Верно! +1 балл 🎉"};
    } else if(ts.attempts>=MAX_ATTEMPTS_REVEAL){
      ts.locked = true;
      ts.feedback = {type:"err", text:"Неверно (3 попытки). Правильный ответ: «"+task.options[task.correct]+"». Задание заблокировано: 0 баллов."};
    } else ts.feedback = {type:"err", text:"Неверно. Попытка "+ts.attempts+" из "+MAX_ATTEMPTS_REVEAL+"."};
  }
  else if(task.kind==="predict"){
    const given = normAns(ts.answer);
    if(!given){ ts.feedback={type:"warn",text:"Введите ответ (итоговое содержимое ленты / слово)."}; render(); return; }
    ts.attempts++;
    if(given===normAns(task.answer)){
      ts.solved = true;
      ts.feedback = {type:"ok", text: ts.hintUsed ? "Верно! +0,5 балла (использована подсказка)." : "Верно! +1 балл 🎉"};
    } else if(ts.attempts>=MAX_ATTEMPTS_REVEAL){
      ts.locked = true;
      ts.feedback = {type:"err", text:"Неверно (3 попытки). Правильный ответ: «"+task.answer+"». Задание заблокировано: 0 баллов."};
    } else ts.feedback = {type:"err", text:"Неверно. Попытка "+ts.attempts+" из "+MAX_ATTEMPTS_REVEAL+". Загрузите программу в эмулятор и выполните её по шагам."};
  }
  else if(task.kind==="program"){
    const prog = ts.program || "";
    if(!prog.trim()){ ts.feedback={type:"warn",text:"Напишите программу."}; render(); return; }
    let res;
    if(task.machine==="turing") res = tmRunTests(prog, task.tests);
    else if(task.machine==="post") res = postRunTests(prog, task.tests);
    else res = markovRunTests(prog, task.tests);
    ts.attempts++;
    if(res.ok){
      ts.solved = true;
      ts.feedback = {type:"ok", text: ts.hintUsed ? "Все тесты пройдены! +0,5 балла (использована подсказка)." : "Все тесты пройдены! +1 балл 🎉"};
    } else ts.feedback = {type:"err", text:res.msg+" (попытка "+ts.attempts+")"};
  }
  render();
}
function bindInputs(){
  document.querySelectorAll("[data-action]").forEach(b=>b.addEventListener("click", onAction));
  app.querySelectorAll("[data-model]").forEach(el=>{
    el.addEventListener("input", onModelInput);
    el.addEventListener("change", onModelInput);
  });
}
function onModelInput(e){
  const el = e.target, model = el.dataset.model, id = el.dataset.id;
  if(model==="ts.answer") getTS(id).answer = el.value;
  else if(model==="ts.program") getTS(id).program = el.value;
  else if(model==="ts.selected"){
    getTS(id).selected = +el.value;
    const wrap = el.closest(".task");
    if(wrap) wrap.querySelectorAll(".option").forEach(o=>o.classList.remove("selected"));
    if(el.closest(".option")) el.closest(".option").classList.add("selected");
  }
  else if(model==="emu.program"){ state.emu[id].program = el.value; state.emu[id].runtime = null; updateEmuViz(id); }
  else if(model==="emu.word"){ state.emu[id].word = el.value; state.emu[id].runtime = null; updateEmuViz(id); }
  else if(model==="studentName") state.studentName = el.value;
  saveState();
}

/* =========================================================
   INIT
   ========================================================= */
function init(){ render(); }
init();
</script>
